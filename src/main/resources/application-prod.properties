# ==========================================
# Configurações de Produção (MySQL / Deploy Render / Docker)
# ==========================================
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/agrix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=false

api.security.token.secret=${JWT_SECRET}
