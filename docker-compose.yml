version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: agrix-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: agrix_db
    ports:
      - "3306:3306"
    volumes:
      - agrix-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agrix-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrix-api
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/agrix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: secret
      JWT_SECRET: supersecrettokenkeyagrixportfolio2026
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agrix-network

volumes:
  agrix-mysql-data:
    driver: local

networks:
  agrix-network:
    driver: bridge
